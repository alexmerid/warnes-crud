{% extends "base.html" %}

{% block title %}Gestión de Vias{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">Lista de Vias</h2>
    <!-- Botón para abrir el  modal de agregar -->
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addModal">Agregar Via</button>
</div>

<!-- Tabla de Vias -->
<table class="table table-bordered table-striped">
    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Descripción</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for via in vias %}
        <tr>
            <td>{{ via.id }}</td>
            <td>{{ via.descripcion }}</td>
            <td>
                <!-- Botón editar -->
                <button class="btn btn-warning btn-sm" data-bs-toggle="modal" data-bs-target="#editModal"
                    onclick="editVia('{{ via.id }}', '{{ via.descripcion }}')">
                    Editar
                </button>

                <!-- Botón eliminar -->
                <a href="{{ url_for('borrar_via', id_via=via.id) }}" class="btn btn-danger btn-sm"
                    onclick="return confirm('Se eliminará la Via con ID {{ via.id }} ¿Está usted seguro?');">
                    Eliminar
                </a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<!-- Modal Agregar -->
<div class="modal fade" id="addModal" tabindex="-1" aria-labelledby="addModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form action="{{ url_for('agregar_via') }}" method="POST">
                <div class="modal-header">
                    <h5 class="modal-tittle">Agregar Via</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <div id="addError" class="alert alert-danger d-none" role="alert"></div>
                    <div class="mb-3">
                        <label for="add_id" class="form-label">ID</label>
                        <input type="number" name="id" id="add_id" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="add_descripcion" class="form-label">Descripción</label>
                        <input type="text" name="descripcion" id="add_descripcion" class="form-control" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Modal Editar -->
<div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form action="{{ url_for('editar_via') }}" method="POST">
                <div class="modal-header">
                    <h5 class="modal-title">Editar Via</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <div id="editError" class="alert alert-danger d-none" role="alert"></div>
                    <input type="hidden" name="id" id="edit_id">
                    <div class="mb-3">
                        <label for="edit_descripcion" class="form-label">Descripcion</label>
                        <input type="text" name="descripcion" id="edit_descripcion" class="form-control" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-warning">Actualizar</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}

{% block script%}
<script src="{{ url_for('static', filename='via.js') }}"></script>
{% endblock %}
